name: vps789

on:
  push:              # 每次 push 时触发
  schedule:
   - cron: '15 8 * * *' # 每3小时运行一次
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装环境
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
          
      - name: 抓取原始数据
        run: python vps789/crawler.py

      - name: 比对变更并处理文件
        run: |
          # 1. 设置 Git 信息
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 2. 获取北京时间
          BEIJING_TIME=$(date -d "+8 hours" "+%m-%d %H:%M")
          echo "当前北京时间: $BEIJING_TIME"
          
          # 3. 进入目录
          cd vps789/
          
          # 确保 domains.txt 末尾有换行符
          if [ -f domains.txt ] && [ -s domains.txt ]; then
            sed -i -e '$a\' domains.txt
          fi
          
          git add domains.txt
          
          # 比对暂存区与上次提交的区别
          if git diff --cached --quiet domains.txt; then
            echo "domains.txt 内容无变化，跳过生成和提交。"
          else
            echo "检测到域名列表有更新，开始加工文件..."
            
            TOTAL_COUNT=$(wc -l < domains.txt)
            echo "总域名数量: $TOTAL_COUNT"
            
            # 生成完整列表
            generate_file() {
              local name=$1
              local count=$2
              local file="${name}.txt"
              local head="ai7777777.zhuqq.qzz.io:443#▼ ${name} | 数据更新时间：${BEIJING_TIME}"
              local foot="ct.1.zhuqq.qzz.io:443#▲ 优选域名 | VPS789 7*24监测"
              
              echo "$head" > "$file"
              
              if [ "$count" = "all" ]; then
                awk '{print $0":443#"$0}' domains.txt >> "$file"
              else
                head -n "$count" domains.txt | awk '{print $0":443#"$0}' >> "$file"
              fi
              
              echo "$foot" >> "$file"
              echo "生成完成: $file"
            }
            
            # 生成所有需要的文件
            generate_file "all" "all"           # 完整列表
            generate_file "top200" "200"        # 前200
            generate_file "top100" "100"        # 前100
            generate_file "top50" "50"          # 前50
            generate_file "top10" "10"          # 前10
            
            # 提交所有变更
            git add *.txt
            git commit -m "vps789 $BEIJING_TIME - 更新 $TOTAL_COUNT 条域名"
            
            # 拉取并推送
            git pull --rebase origin main
            git push origin main
          fi
